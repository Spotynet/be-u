# Host nginx for Nabbi PRODUCTION (dedicated EC2).
# Proxies all Nabbi hostnames to Compose project nginx on 127.0.0.1:8080.
# Install: sudo ./deploy/setup-prod-nginx.sh
# TLS:     sudo certbot --nginx -d be-u.ai -d api.be-u.ai -d app.be-u.ai

upstream nabbi_compose {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name be-u.ai api.be-u.ai app.be-u.ai;

    client_max_body_size 50m;

    location / {
        proxy_pass http://nabbi_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
