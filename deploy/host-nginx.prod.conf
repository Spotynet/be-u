# Host nginx for Nabbi PRODUCTION (dedicated EC2).
# Proxies public hostnames to Compose project nginx on 127.0.0.1:8080.
# Public DNS needed: nabbi.app (web) + api.nabbi.app (API).
# Install: sudo ./deploy/setup-prod-nginx.sh
# TLS:     sudo ./deploy/setup-prod-nginx.sh --certbot

upstream nabbi_compose {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nabbi.app api.nabbi.app;

    client_max_body_size 50m;

    location / {
        proxy_pass http://nabbi_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
