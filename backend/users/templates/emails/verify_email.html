<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu código de verificación - nabbi</title>
</head>
<body style="margin:0;padding:0;background:#faf8f3;font-family:Poppins,Arial,sans-serif;color:#12211a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#faf8f3;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #ccd8ce;padding:32px 28px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:0.04em;color:#558367;">nabbi</p>
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;font-weight:700;color:#12211a;">
                Verifica tu correo
              </h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#3d6050;">
                Hola{% if first_name %} {{ first_name }}{% endif %}, usa este código para continuar con tu cuenta:
              </p>
              <p style="margin:0 0 24px;text-align:center;font-size:32px;letter-spacing:0.28em;font-weight:700;color:#1f3328;">
                {{ code }}
              </p>
              <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#3d6050;">
                Expira en {{ ttl_minutes }} minutos.
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#5a7d6a;">
                Si no creaste una cuenta, ignora este mensaje.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#5a7d6a;">— nabbi · {{ year }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
