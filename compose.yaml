services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    expose:
      - "3007"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    env_file:
      - ./web/.env.local
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://api:3007}
      NEXT_PUBLIC_BACKEND_ORIGIN: ${NEXT_PUBLIC_BACKEND_ORIGIN:-http://api:3007}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nabbi-api-dev.spotynet.com/api}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    expose:
      - "3008"
    depends_on:
      - api
    restart: unless-stopped

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile.dev
    env_file:
      - ./mobile/.env
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://nabbi-api-dev.spotynet.com}
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    expose:
      - "3009"
    stdin_open: true
    tty: true
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3020:80"
    environment:
      NABBI_WEB_HOST: ${NABBI_WEB_HOST:-nabbi-dev.spotynet.com}
      NABBI_API_HOST: ${NABBI_API_HOST:-nabbi-api-dev.spotynet.com}
      NABBI_MOBILE_HOST: ${NABBI_MOBILE_HOST:-nabbi-mobile-dev.spotynet.com}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - web
      - mobile
      - api
    restart: unless-stopped

volumes:
  web_node_modules:
  mobile_node_modules:
