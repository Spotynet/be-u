services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    # Bind-mount hot reload needs root; prod image runs as uid 1001.
    user: "0:0"
    env_file:
      - ./backend/.env
    environment:
      DEBUG: ${DEBUG:-True}
    volumes:
      - ./backend:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:3007"]
    expose:
      - "3007"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3007/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: development
    user: "0:0"
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://api:3007}
      NEXT_PUBLIC_BACKEND_ORIGIN: ${NEXT_PUBLIC_BACKEND_ORIGIN:-http://api:3007}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nabbi-api-dev.spotynet.com/api}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ["npx", "next", "dev", "--turbopack", "-H", "0.0.0.0", "-p", "3008"]
    expose:
      - "3008"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: docker/mobile/Dockerfile
      target: development
    user: "0:0"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://nabbi-api-dev.spotynet.com}
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    command: ["npx", "expo", "start", "--web", "--port", "3009", "--host", "lan"]
    expose:
      - "3009"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3020:80"
    environment:
      NABBI_API_HOST: ${NABBI_API_HOST:-nabbi-api-dev.spotynet.com}
      NABBI_MOBILE_HOST: ${NABBI_MOBILE_HOST:-nabbi-mobile-dev.spotynet.com}
      NABBI_WEB_HOST: ${NABBI_WEB_HOST:-nabbi-dev.spotynet.com}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web
      - mobile
    restart: unless-stopped

volumes:
  web_node_modules:
  mobile_node_modules:
